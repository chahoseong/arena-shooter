+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
; Characters are made of two pieces that answer different questions, so they get a profile each.
;
; The capsule is the body in the world: it walks, finds the floor, and pushes other characters.
; It is not what a shot hits, and it does not push the camera -- the boom is meant to pull in for
; level geometry, and a character at melee distance sits well inside it.
;
; The mesh exists to be hit, and does nothing else. Everything the capsule already handles is
; ignored here rather than answered twice.
